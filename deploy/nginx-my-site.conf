# Coolify → my-site → Static Site → Custom Nginx Configuration
#
# Usar resolver + variável no proxy_pass para NÃO derrubar o nginx no boot
# se a API estiver off ou o nome ainda não resolver (crash loop Exited 10/11).
#
# <API_CONTAINER> = UUID/nome do container my-site-api na rede Coolify
# Ex.: n7ij7ywo1b7ldqb1lsma8hgn  (docker ps | grep my-site-api)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker — resolve em tempo de request, não no start
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://<API_CONTAINER>:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
