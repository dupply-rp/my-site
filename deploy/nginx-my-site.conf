# Coolify → my-site → Static Site → Custom Nginx Configuration
# Substituir <API_CONTAINER> pelo nome do container do app my-site-api
# (docker ps na VPS ou nome interno no painel Coolify)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://<API_CONTAINER>:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
