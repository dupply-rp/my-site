# Coolify → my-site → Static Site → Custom Nginx Configuration
#
# Upstream estável: alias DNS `my-site-api` (Custom Network Aliases no app my-site-api).
# NÃO use o UUID do app como hostname — apps Coolify não têm hostname estável por UUID
# (só databases têm). NÃO use proxy_pass com hostname literal sem variável: o nginx
# resolve no boot e cai em crash loop (Exited 10/11) se o upstream ainda não existir.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://my-site-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /console/ {
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
