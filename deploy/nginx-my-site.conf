# Coolify → my-site → Static Site → Custom Nginx Configuration
#
# Upstream estável: alias DNS `my-site-api` (Custom Network Aliases no app my-site-api).
# NÃO use o UUID do app como hostname — apps Coolify não têm hostname estável por UUID
# (só databases têm). NÃO use proxy_pass com hostname literal sem variável: o nginx
# resolve no boot e cai em crash loop (Exited 10/11) se o upstream ainda não existir.
#
# SEO: o build grava um HTML por rota (`/termos` → `termos.html`) com title e canonical
# próprios. Por isso `$uri.html` vem antes de qualquer fallback, e o que não existe
# devolve 404 de verdade — o fallback cego para /index.html fazia todo endereço
# inventado responder 200 com o conteúdo da home (soft 404 no Search Console).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Location relativo nos 301: o esquema/host quem define é o Traefik na borda,
    # senão o redirect volta em http e vira um salto a mais.
    absolute_redirect off;

    error_page 404 /404.html;

    # Um endereço só para o site: o www responde 301 permanente para o apex.
    # Feito aqui, e não no "Redirect: non-www" do Coolify, porque o Traefik devolve
    # 307 (temporário) e o Google não consolida os sinais das duas versões.
    if ($host = www.dupply.com.br) {
        return 301 https://dupply.com.br$request_uri;
    }

    location ^~ /api/ {
        set $api_upstream http://my-site-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Console interno: SPA própria, sem indexação (noindex no HTML dela).
    location = /console {
        return 301 /console/;
    }

    location ^~ /console/ {
        try_files $uri /console/index.html =404;
    }

    # Bundles com hash no nome: imutáveis.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /termos/ → /termos: um endereço só por página.
    location ~ ^(?<sem_barra>/.+)/$ {
        return 301 $sem_barra$is_args$args;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
